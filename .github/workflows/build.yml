name: Build ZY-366 FanchmWrt
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout fanchmwrt source
        uses: actions/checkout@v4
        with:
          repository: fanchmwrt/fanchmwrt
          ref: fanchmwrt-25.12.6
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev rsync unzip zlib1g-dev file wget xz-utils python3-setuptools libelf-dev aria2

      - name: Apply ZY-366 device port
        run: |
          echo "" | base64 -d > target/linux/ramips/dts/mt7620n_zongyi_zy-366.dts
          echo "" | base64 -d > port_zy366.py
          python3 port_zy366.py
          grep -q 'zongyi,zy-366' target/linux/ramips/mt7620/base-files/etc/board.d/02_network
          grep -q 'zongyi_zy-366' target/linux/ramips/image/mt7620.mk
          echo PORT-VERIFIED

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate config
        run: |
          echo "" | base64 -d > .config
          for d in feeds/fanchmwrt/luci-app-fwx-*; do echo "CONFIG_PACKAGE_$(basename $d)=y" >> .config; done
          make defconfig
          grep -q 'CONFIG_TARGET_ramips_mt7620_DEVICE_zongyi_zy-366=y' .config
          echo CONFIG-VERIFIED

      - name: Download sources
        run: make download -j4

      - name: Build firmware
        run: |
          make -j4 V=s | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Show build tail on failure
        if: failure()
        run: tail -80 build.log

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: zy366-fanchmwrt-firmware
          path: |
            bin/targets/ramips/mt7620/openwrt-ramips-mt7620-zongyi_zy-366-squashfs-sysupgrade.bin
            bin/targets/ramips/mt7620/openwrt-ramips-mt7620-zongyi_zy-366.manifest
            bin/targets/ramips/mt7620/sha256sums
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: zy366-build-log
          path: build.log
